name: SezamYU
options:
  bundleIdPrefix: net.oldsezam
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    majorVersion: 7.0.0
targets:
  SezamYU:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    dependencies:
      - package: GRDB
        product: GRDB
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Sezam BBS
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        # iPhone stays portrait-only. An iPad is big enough to read a
        # thread sideways, and a rotation lock on one is the mark of a
        # phone app running on a tablet -- the ~ipad key overrides the
        # line above on that idiom only.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Where the app looks for the archive manifest. Swap this one string for
        # the archive.org URL -- no code changes.
        # Tried in order; first valid JSON wins. GitHub Pages is listed first
        # but does not exist yet — the app silently falls through to
        # archive.org until the repo and Pages are set up.
        SezamManifestURLs:
          - https://mihailod.github.io/sezam/build/sezam-manifest.json
          - https://archive.org/download/sezam-manifest/sezam-manifest.json
        # Only OS-provided crypto (HTTPS, CryptoKit SHA-256 checksum): answers
        # App Store Connect's export-compliance question for every build.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_NAME: Sezam BBS
        PRODUCT_BUNDLE_IDENTIFIER: net.oldsezam.reader
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"        # iPhone and iPad
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_VERSION: "5.0"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
